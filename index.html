<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- minimum-scale=1.0, maximum-scale=1.0, user-scalable=no解决移动端聚焦el-input后页面自动放大问题 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 隐藏苹果工具栏和菜单栏 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>vue3</title>
</head>
<body>
  <script>
    if (!window.__MICRO_APP_ENVIRONMENT__) {
      document.body.outerHTML = '<h2>暂不支持独立运行子应用, 请在微前端环境中打开该应用!</h2>';
      window.stop();
    }
  </script>
  <div id="__subapp_vue3" class="render-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
